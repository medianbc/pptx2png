name: CI/CD pptx2png

on:
  push:
    branches:
      - test
      - main

permissions:
  contents: write

jobs:
  deploy-and-test:
    runs-on: [self-hosted, raspberry]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- ЛОГИКА ДЛЯ ТЕСТОВОЙ ВЕТКИ ---
      - name: Deploy and Test on Test Branch
        if: github.ref == 'refs/heads/test'
        run: |
          # 1. Синхронизируем код, строго исключая локальный рабочий конфиг и whitelist тестовой папки
          rsync -av --exclude='.git*' --exclude='config*' --exclude='allowed_users*' ./ /home/pi/app/pptx2png/test/
          
          cd /home/pi/app/pptx2png/test/
          chmod +x manage.sh
          
          # 2. Гарантированно останавливаем старую запущенную копию теста перед новым тестом
          ./manage.sh stop || true
          
          # 3. Запускаем бота в изолированной среде RAM-диска
          echo "🚀 Запуск тестового бота через упакованный manage.sh..."
          env RUNNER_TRACKING_ID=0 ./manage.sh start
          
          # 4. Даем aiogram 4 секунды на инициализацию и валидацию токена
          sleep 4
          
          # 5. Интеллектуальная проверка: упал бот или успешно работает?
          if ./manage.sh status | grep -q "🟢 Бот РАБОТАЕТ"; then
              echo "✅ Тест пройден успешно! Бот стабилен в фоне."
              
              # Копируем логи из RAM-диска во временную папку воркфлоу для сохранения на GitHub
              # Нам нужно вытащить путь RAM-диска динамически
              SHM_LOG_DIR="/dev/shm/pptx2png_tasks/test/logs"
              cp "$SHM_LOG_DIR/bot.log" ${{ github.workspace }}/bot.log || true
              cp "$SHM_LOG_DIR/debug.log" ${{ github.workspace }}/debug.log || true
              
              # Гасим тестового бота, чтобы он не висел в памяти вечно, если это просто секундный запуск
              ./manage.sh stop
          else
              echo "❌ Ошибка старта бота! Сборка провалена."
              SHM_LOG_DIR="/dev/shm/pptx2png_tasks/test/logs"
              echo "=== СИСТЕМНЫЙ ВЫВОД NOHUP ==="
              cat "$SHM_LOG_DIR/sys_nohup.log" || true
              exit 1
          fi

      # 6. Вместо коммита в репозиторий безопасно сохраняем логи в интерфейсе GitHub
      - name: Upload Test Logs to GitHub Artifacts
        if: github.ref == 'refs/heads/test' && always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            ${{ github.workspace }}/bot.log
            ${{ github.workspace }}/debug.log
          retention-days: 5

      # --- ЛОГИКА ДЛЯ РАБОЧЕЙ ВЕТКИ (ПРОДАКШН) ---
      - name: Deploy to Production Branch
        if: github.ref == 'refs/heads/main'
        run: |
          # 1. Синхронизируем код, строго исключая перезапись боевого config/allowed_users
          rsync -av --exclude='.git*' --exclude='debug.log' --exclude='config*' --exclude='allowed_users*' ./ /home/pi/app/pptx2png/prod/
          
          # 2. Автоматический перезапуск продакшн-бота через manage.sh
          cd /home/pi/app/pptx2png/prod/
          chmod +x manage.sh
          
          # Отвязываем фоновый процесс от сессии GitHub Runner
          env RUNNER_TRACKING_ID=0 ./manage.sh restart || echo "Failed to restart, check manage.sh"
          
          # Проверяем статус для логов GitHub Actions
          sleep 2
          ./manage.sh status

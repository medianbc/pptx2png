name: OBS macOS installation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "core/**"
      - "obs_local/**"
      - "install_obs_local_macos.sh"
      - ".github/workflows/test-obs-macos.yml"

permissions:
  contents: read

jobs:
  install-and-smoke-test:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install the local OBS package from a source archive without Git
        env:
          CI: "true"
          PPTX2PNG_SOURCE_REVISION: ${{ github.sha }}
          PPTX2PNG_INSTALL_DIR: ${{ runner.temp }}/pptx2png-install
        run: ./install_obs_local_macos.sh "$PPTX2PNG_INSTALL_DIR"

      - name: Verify launchers and LibreOffice
        env:
          PPTX2PNG_INSTALL_DIR: ${{ runner.temp }}/pptx2png-install
        run: |
          cd "$PPTX2PNG_INSTALL_DIR"
          test -x start_obs_local.sh
          test -x prepare_obs_songs.sh
          ./.venv/bin/python --version
          /Applications/LibreOffice.app/Contents/MacOS/soffice --headless --version
          printf '0\n' | ./start_obs_local.sh
          ./prepare_obs_songs.sh --help

      - name: Run isolated local tests
        env:
          TMPDIR: ${{ runner.temp }}
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pptx2png-pycache
          PPTX2PNG_INSTALL_DIR: ${{ runner.temp }}/pptx2png-install
        run: |
          cd "$PPTX2PNG_INSTALL_DIR"
          ./.venv/bin/python -m unittest discover -s obs_local/tests -v

      - name: Smoke-test PPTX to PNG conversion
        env:
          TMPDIR: ${{ runner.temp }}
          PPTX2PNG_INSTALL_DIR: ${{ runner.temp }}/pptx2png-install
        run: |
          cd "$PPTX2PNG_INSTALL_DIR"
          ./.venv/bin/python - <<'PY'
          import asyncio
          import os
          import shutil
          import tempfile
          from pathlib import Path
          from unittest.mock import patch

          import pymupdf
          from pptx import Presentation
          from pptx.util import Inches, Pt
          from pptx2png_core import converter_engine

          with tempfile.TemporaryDirectory(prefix="pptx2png-macos-") as directory:
              root = Path(directory)
              font_source = Path("/System/Library/Fonts/Menlo.ttc")
              if not font_source.is_file():
                  raise SystemExit("Required macOS test font Menlo.ttc is missing")
              fonts = root / "fonts"
              fonts.mkdir()
              shutil.copyfile(font_source, fonts / font_source.name)

              presentation = Presentation()
              slide = presentation.slides.add_slide(presentation.slide_layouts[6])
              box = slide.shapes.add_textbox(Inches(1), Inches(1), Inches(8), Inches(2))
              run = box.text_frame.paragraphs[0].add_run()
              run.text = "Font profile integration test 12345"
              run.font.name = "Menlo"
              run.font.size = Pt(24)
              source = root / "smoke-test.pptx"
              presentation.save(source)
              output = root / "png"
              output.mkdir()

              with (
                  patch.dict(os.environ, {"PPTX2PNG_FONT_DIRS": str(fonts)}),
                  patch.object(
                      converter_engine,
                      "_soffice_fallback_args",
                      side_effect=AssertionError("Unexpected invisible fallback"),
                  ),
              ):
                  pdf = converter_engine.pptx_to_pdf_crossplatform(source, root / "pdf")
                  with pymupdf.open(pdf) as document:
                      font_names = {font[3].split("+")[-1] for font in document[0].get_fonts()}
                      if not any("Menlo" in name for name in font_names):
                          raise SystemExit(f"Expected Menlo in PDF, found: {font_names}")
                      if run.text not in document[0].get_text():
                          raise SystemExit("Expected text was not rendered in PDF")

                  png_paths, _ = asyncio.run(
                      converter_engine.convert_all_pngs(source, output, "standard")
                  )
              if len(png_paths) != 1 or not png_paths[0].is_file():
                  raise SystemExit("Expected one rendered PNG slide")
          PY

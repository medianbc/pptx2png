[YandexDisk]
base_path = /01_СЛАЙДЫ (nbc.church)/Готовые презентации для проектора и трансляции
source_folder = Служение
sermon_keyword = проповед

[SlideCategories]
sermon_keywords = проповед,проповедь
opening_keywords = начало,в начале
prayer_keywords = молитва,молиться

[OBS Local paths]
root_path = ./obs_png
quality = standard

[Song preparation]
# Источник программы: google или yandex. При ошибке не переключаемся во второе облако.
priority_cloud_disk = google
program_google_url =
program_yandex_url =
# Совместимость со старыми настройками: program_url используется,
# только если ссылка относится к выбранному облаку и отдельная ссылка не задана.
# Для Яндекс.Диска нужна публичная ссылка именно на файл:
# https://disk.yandex.ru/d/<public-key>
# Или публичный Google Docs с разрешённым скачиванием:
# https://docs.google.com/document/d/<id>/edit
program_url = https://disk.yandex.ru/i/S4CRCWdrzxYmVg
local_zip_dir = ./song_assets/zip
local_pptx_dir = ./song_assets/pptx
# Пути к папкам на Яндекс.Диске, разделитель — вертикальная черта.
# Поиск выполняется после локальных ZIP и PPTX; вложенность — до 3 уровней.
yandex_zip_png_paths = /01_СЛАЙДЫ (nbc.church)/Готовые презентации для проектора и трансляции/слайды для трансляции, темный фон/png
yandex_zip_png_url = https://disk.yandex.ru/d/ENXhFCs2wmpOkQ
yandex_pptx_paths = /01_СЛАЙДЫ (nbc.church)/Готовые презентации для проектора и трансляции/слайды для трансляции, темный фон/pptx
yandex_pptx_url = https://disk.yandex.ru/d/8A2sqQhFNPR8fA
# В конце обработки сканировать эти папки и кэшировать материалы без локального ZIP с PNG.
cache_missing_yandex_song_zips = false

[Logging]
# Шаблон для независимых settings.linux.ini, settings.macos.ini, settings.windows.ini.
# Путь логов выбирается при первом запуске по ОС; obs_local.log и debug.log.
log_dir = /dev/shm/pptx2png_tasks/obs_local/logs

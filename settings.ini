[Paths]
# Пути к папкам. Если оставить пустыми, бот применит дефолтные значения.
# Аргументы командной строки при запуске будут иметь более высокий приоритет.
# log_dir = /var/log/pptx2png
# shm_dir = /dev/shm/my_custom_tasks

[Limits]
# Пример будущих параметров, которые вы сможете здесь хранить:
# max_file_size_mb = 50
# process_timeout_sec = 300

[YandexDisk]
# Базовая папка на Яндекс.Диске
base_path = /01_СЛАЙДЫ (nbc.church)/Готовые презентации для проектора и трансляции

# Имена подпапок внутри папки даты
source_folder = Служение
target_folder = Трансляция

# Подпапка внутри Трансляции, куда бот складывает свои PNG
pptx2png_folder = pptx2png

# Подпапка для проповеди (внутри pptx2png_folder)
sermon_folder = проповедь - png

# Ключевое слово для поиска в заметках
sermon_keyword = проповед

# Файл со структурой папок
template_file = template.yaml

[Timeouts]
# Таймаут ожидания ответа пользователя на промпт (в секундах)
prompt_timeout_sec = 1800

# Интервал очистки старых задач (в секундах)
cleanup_interval_sec = 300

# Возраст задачи, после которого она удаляется (в секундах)
cleanup_max_age_sec = 7200

[SlideCategories]
# Ключевые слова для поиска проповеди (через запятую)
sermon_keywords = проповед,проповедь

# Ключевые слова для поиска «начало собрания» (этап 2, пока не используется)
opening_keywords = начало,в начале

# Ключевые слова для поиска молитвы (этап 2, пока не используется)
prayer_keywords = молитва,молиться